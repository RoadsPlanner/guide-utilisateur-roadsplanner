site_name: Guide utilisateur RoadsPlanner
site_url: https://roadsplanner.github.io/guide-utilisateur-roadsplanner/
repo_url: https://github.com/RoadsPlanner/guide-utilisateur-roadsplanner
repo_name: RoadsPlanner
nav:
  - Accueil: index.md
  - Premiers pas:
      - Créer un compte: premiers-pas/creer-un-compte.md
      - Se connecter et se déconnecter: premiers-pas/se-connecter.md
      - Découvrir l'écran: premiers-pas/decouvrir-l-ecran.md
      - Installer l'application: premiers-pas/installer.md
  - Préparer un roadtrip:
      - Créer un roadtrip: roadtrip/creer.md
      - Ajouter une étape: roadtrip/ajouter-une-etape.md
      - Choisir où dormir: roadtrip/hebergement.md
      - Suivre le roadtrip: roadtrip/tableau-de-bord.md
      - Voir le trajet sur la carte: roadtrip/carte.md
      - Modifier ou supprimer: roadtrip/modifier-supprimer.md
  - Voyager à plusieurs:
      - Partager un roadtrip: partage/partager.md
      - Les droits de chacun: partage/droits.md
  - Aide:
      - Questions fréquentes: aide/faq.md
      - Problèmes et solutions: aide/problemes.md
      - Lexique: aide/lexique.md
theme:
  name: material
  custom_dir: overrides
  language: fr
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Basculer en mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Basculer en mode clair
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_name: RoadsPlanner user guide
          nav_translations:
            Accueil: Home
            Premiers pas: Getting started
            Créer un compte: Create an account
            Se connecter et se déconnecter: Log in and log out
            Découvrir l'écran: Find your way around
            Installer l'application: Install the app
            Préparer un roadtrip: Plan a road trip
            Créer un roadtrip: Create a road trip
            Ajouter une étape: Add a stop
            Choisir où dormir: Choose where to sleep
            Suivre le roadtrip: Follow your road trip
            Voir le trajet sur la carte: See the route on the map
            Modifier ou supprimer: Edit or delete
            Voyager à plusieurs: Travel together
            Partager un roadtrip: Share a road trip
            Les droits de chacun: Who can do what
            Aide: Help
            Questions fréquentes: FAQ
            Problèmes et solutions: Problems and solutions
            Lexique: Glossary

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - style/extra.css
  - style/guide.css
